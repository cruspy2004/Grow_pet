<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; font-src 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grow Buddy</title>
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <main class="widget-shell" id="app" data-mode="idle" data-side="left" data-menu="down" data-state="empty">
      <div class="pet-row" id="petRow">
        <div class="pet-slot" id="petSlot" title="Drag to move · click to toggle · right-click for the panel">
          <img class="pet-sprite" id="petSprite" alt="Grow Buddy pet" draggable="false" />
        </div>

        <div class="control-pill" id="controls">
          <div class="bar-wrap" id="barWrap">
            <div class="progress-bar" id="progressBar">
              <div class="progress-fill" id="progressFill"></div>
              <div class="ideal-line" id="idealLine"></div>
            </div>
            <img class="marker-sprite" id="actualSprite" alt="" draggable="false" />
          </div>

          <div class="action-row" id="actionRow">
            <button class="step-button" id="addStepButton" type="button" title="+1 step">+1</button>
            <button class="caret-button" id="caretButton" type="button" aria-label="Open correction menu">&#9662;</button>
          </div>
        </div>
      </div>

      <div class="menu-row" id="menuRow">
        <div class="dropdown" id="dropdownMenu">
          <button class="dropdown-item" id="undoStepButton" type="button">-1</button>
        </div>
      </div>
    </main>
    <script src="shared.js"></script>
    <script src="widget.js"></script>
  </body>
</html>
