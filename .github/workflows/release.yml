name: Release

# Tag a version to ship it:
#   npm version patch   (or minor / major)  -- this creates the v* tag
#   git push --follow-tags
#
# The runner builds the installers and uploads them to a GitHub Release, along
# with the latest.yml that electron-updater reads to offer in-app updates.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npm run dist:win
          - os: ubuntu-latest
            build: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # build/icon.png and build/icon.ico are committed, so nothing is generated
      # here. Regenerate them locally with `npm run icons` whenever the sprite
      # changes -- doing it on CI meant running Electron headless, which needs a
      # virtual display and a pile of system libraries on Linux for no benefit.
      - name: Check icons are present
        shell: bash
        run: test -f build/icon.png && test -f build/icon.ico

      - name: Build and publish
        run: ${{ matrix.build }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No code-signing certificate yet. Windows SmartScreen will warn on
          # first run until one is bought and CSC_LINK / CSC_KEY_PASSWORD are set
          # as repository secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: warn
